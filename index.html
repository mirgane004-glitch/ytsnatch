<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTSnatch - YouTube Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e8eaed; min-height: 100vh;
    padding: 20px 16px 40px; max-width: 640px; margin: 0 auto;
  }
  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 30px; background: linear-gradient(90deg,#ff4e45,#ff9a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: #9aa0a6; font-size: 14px; margin-top: 4px; }
  .card { background: #1a1d23; border: 1px solid #2a2e36; border-radius: 14px;
    padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; background: #0f1115; border: 1px solid #3a3f47; border-radius: 10px;
    color: #e8eaed; padding: 13px 12px; font-size: 16px; min-width: 0;
  }
  button {
    border: none; border-radius: 10px; padding: 13px 18px; font-size: 16px;
    font-weight: 600; cursor: pointer; color: #fff; background: #2a2e36;
  }
  button.primary { background: #d93025; }
  button.primary:active { background: #b3261e; }
  button:disabled { opacity: .45; cursor: default; }
  .hidden { display: none !important; }
  .spinner {
    width: 20px; height: 20px; border: 3px solid #3a3f47; border-top-color: #ff4e45;
    border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;
    vertical-align: -4px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { margin-top: 12px; font-size: 15px; color: #c9cdd2; min-height: 20px; }
  .error { background: #3a1d1d; border: 1px solid #7a2e2e; color: #ffb4ab;
    border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 15px; }
  #videoCard img { width: 100%; border-radius: 10px; display: block; }
  #videoCard h2 { font-size: 18px; margin: 12px 0 4px; line-height: 1.35; }
  #videoCard .meta { color: #9aa0a6; font-size: 14px; }
  .qualities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .quality {
    border: 2px solid #3a3f47; border-radius: 12px; padding: 12px; cursor: pointer;
    background: #12141a; text-align: left; color: #e8eaed;
  }
  .quality .q-label { font-size: 19px; font-weight: 700; display: block; }
  .quality .q-detail { color: #9aa0a6; font-size: 13px; }
  .quality.selected { border-color: #ff4e45; background: #241a1a; }
  .quality .saved-tag { color: #ff9a3d; font-size: 12px; font-weight: 700; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; }
  .toggle-row input { width: 20px; height: 20px; accent-color: #d93025; }
  #downloadBtn { width: 100%; margin-top: 14px; padding: 15px; font-size: 17px; }
  .progress-wrap { background: #0f1115; border-radius: 8px; height: 16px; overflow: hidden; margin-top: 12px; }
  #progressBar { height: 100%; width: 0%; background: linear-gradient(90deg,#ff4e45,#ff9a3d); transition: width .3s; }
  #progressText { font-size: 14px; color: #c9cdd2; margin-top: 8px; min-height: 18px; }
  #cancelBtn { width: 100%; margin-top: 10px; }
  .done-box { background: #17351f; border: 1px solid #2e7a44; color: #a7e8bb;
    border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 15px; word-break: break-word; }
  .save-link { display: inline-block; margin-top: 10px; background: #d93025; color: #fff;
    padding: 12px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; }
  h3.section { font-size: 16px; margin-bottom: 10px; color: #c9cdd2; }
  .history-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #2a2e36; align-items: center; }
  .history-item:last-child { border-bottom: none; }
  .history-item img { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; }
  .history-item .h-title { font-size: 14px; line-height: 1.3; }
  .history-item .h-meta { color: #9aa0a6; font-size: 12px; }
  .empty { color: #9aa0a6; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>YTSnatch</h1>
  <p>Paste a YouTube link, pick a quality, download.</p>
</header>

<div class="card">
  <div class="row">
    <input type="text" id="urlInput" placeholder="Paste YouTube link here..." autocomplete="off">
    <button id="pasteBtn" title="Paste from clipboard">Paste</button>
  </div>
  <button id="fetchBtn" class="primary" style="width:100%; margin-top:10px;">Get video</button>
  <div id="status"></div>
  <div id="errorBox" class="error hidden"></div>
</div>

<div class="card hidden" id="videoCard">
  <img id="thumb" alt="Video thumbnail">
  <h2 id="vTitle"></h2>
  <div class="meta" id="vMeta"></div>
  <div class="qualities" id="qualityGrid"></div>
  <label class="toggle-row">
    <input type="checkbox" id="autoToggle">
    <span>Always download in this quality without asking</span>
  </label>
  <button id="downloadBtn" class="primary">Download</button>
  <div id="progressArea" class="hidden">
    <div class="progress-wrap"><div id="progressBar"></div></div>
    <div id="progressText"></div>
    <button id="cancelBtn">Cancel download</button>
  </div>
  <div id="doneBox" class="done-box hidden"></div>
</div>

<div class="card">
  <h3 class="section">Recent downloads</h3>
  <div id="historyList"><span class="empty">Nothing downloaded yet.</span></div>
</div>

<script>
(function () {
  "use strict";
  var LS_QUALITY = "tubefetch_quality";   // e.g. "720" or "audio"
  var LS_AUTO = "tubefetch_auto";
  var LS_HISTORY = "tubefetch_history";

  var urlInput = document.getElementById("urlInput");
  var fetchBtn = document.getElementById("fetchBtn");
  var pasteBtn = document.getElementById("pasteBtn");
  var statusEl = document.getElementById("status");
  var errorBox = document.getElementById("errorBox");
  var videoCard = document.getElementById("videoCard");
  var thumb = document.getElementById("thumb");
  var vTitle = document.getElementById("vTitle");
  var vMeta = document.getElementById("vMeta");
  var qualityGrid = document.getElementById("qualityGrid");
  var autoToggle = document.getElementById("autoToggle");
  var downloadBtn = document.getElementById("downloadBtn");
  var progressArea = document.getElementById("progressArea");
  var progressBar = document.getElementById("progressBar");
  var progressText = document.getElementById("progressText");
  var cancelBtn = document.getElementById("cancelBtn");
  var doneBox = document.getElementById("doneBox");
  var historyList = document.getElementById("historyList");

  var currentInfo = null;
  var selected = null;      // {kind, height, label}
  var currentJob = null;
  var pollTimer = null;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove("hidden");
  }
  function clearError() { errorBox.classList.add("hidden"); }
  function setStatus(html) { statusEl.innerHTML = html; }

  function savedQuality() { return localStorage.getItem(LS_QUALITY); }
  function qualityKey(q) { return q.kind === "audio" ? "audio" : String(q.height); }

  autoToggle.checked = localStorage.getItem(LS_AUTO) === "1";
  autoToggle.addEventListener("change", function () {
    localStorage.setItem(LS_AUTO, autoToggle.checked ? "1" : "0");
  });

  pasteBtn.addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t) { urlInput.value = t; fetchInfo(); }
      }).catch(function () {
        setStatus("Couldn't read the clipboard - paste manually with a long-press.");
      });
    }
  });

  urlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") fetchInfo();
  });
  fetchBtn.addEventListener("click", fetchInfo);

  function fetchInfo() {
    var url = urlInput.value.trim();
    clearError();
    doneBox.classList.add("hidden");
    if (!url) { showError("Paste a YouTube link first."); return; }
    fetchBtn.disabled = true;
    setStatus('<span class="spinner"></span>Fetching video info - this can take 10-30 seconds...');
    videoCard.classList.add("hidden");
    fetch("/api/info", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url })
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || "Server error");
        return data;
      });
    }).then(function (info) {
      setStatus("");
      fetchBtn.disabled = false;
      currentInfo = info;
      currentInfo.url = url;
      renderInfo(info);
      if (autoToggle.checked && savedQuality()) {
        startDownload();
      }
    }).catch(function (err) {
      setStatus("");
      fetchBtn.disabled = false;
      showError(err.message || "Could not reach the server. Is python3 app.py still running?");
    });
  }

  function renderInfo(info) {
    thumb.src = info.thumbnail || "";
    vTitle.textContent = info.title || "Untitled";
    vMeta.textContent = (info.channel || "") + "  ·  " + (info.duration || "");
    qualityGrid.innerHTML = "";
    selected = null;
    var saved = savedQuality();
    info.formats.forEach(function (f) {
      var btn = document.createElement("button");
      btn.className = "quality";
      var isSaved = saved && saved === qualityKey(f);
      btn.innerHTML = '<span class="q-label">' + f.label + "</span>" +
        '<span class="q-detail">' + f.detail + (f.size ? " · ~" + f.size : "") + "</span>" +
        (isSaved ? '<span class="saved-tag">  ★ your usual</span>' : "");
      btn.addEventListener("click", function () { selectQuality(f, btn); });
      qualityGrid.appendChild(btn);
      if (isSaved || (!selected && !saved)) {
        if (!selected) selectQuality(f, btn);
        if (isSaved) selectQuality(f, btn);
      }
    });
    videoCard.classList.remove("hidden");
  }

  function selectQuality(f, btn) {
    selected = f;
    var cards = qualityGrid.querySelectorAll(".quality");
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove("selected");
    btn.classList.add("selected");
    localStorage.setItem(LS_QUALITY, qualityKey(f));
  }

  downloadBtn.addEventListener("click", startDownload);

  function startDownload() {
    if (!currentInfo || !selected) return;
    clearError();
    doneBox.classList.add("hidden");
    downloadBtn.disabled = true;
    progressArea.classList.remove("hidden");
    progressBar.style.width = "0%";
    progressText.textContent = "Starting download...";
    fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: currentInfo.url,
        kind: selected.kind,
        height: selected.height
      })
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || "Server error");
        return data;
      });
    }).then(function (data) {
      currentJob = data.job_id;
      pollTimer = setInterval(pollProgress, 1000);
      pollProgress();
    }).catch(function (err) {
      downloadBtn.disabled = false;
      progressArea.classList.add("hidden");
      showError(err.message || "Download failed to start.");
    });
  }

  function pollProgress() {
    if (!currentJob) return;
    fetch("/api/progress/" + currentJob).then(function (r) { return r.json(); })
      .then(function (p) {
        if (p.percent !== null && p.percent !== undefined) {
          progressBar.style.width = p.percent + "%";
        }
        var line = "";
        if (p.status === "downloading") {
          line = (p.percent !== null && p.percent !== undefined ? p.percent + "%" : "Working...") +
            (p.speed ? "  ·  " + p.speed : "") + (p.eta ? "  ·  ETA " + p.eta : "");
          progressText.textContent = line;
        } else if (p.status === "done") {
          var jid = currentJob;
          stopPolling();
          downloadBtn.disabled = false;
          progressText.textContent = "100%";
          progressBar.style.width = "100%";
          doneBox.innerHTML = "&#10003; Ready: <b>" + (p.filename || "video file") + "</b>" +
            '<br><a class="save-link" href="/api/file/' + jid + '">&#11015; Save video to this device</a>';
          doneBox.classList.remove("hidden");
          addHistory(currentInfo, selected);
        } else if (p.status === "cancelled") {
          stopPolling();
          downloadBtn.disabled = false;
          progressArea.classList.add("hidden");
          setStatus("Download cancelled.");
        } else if (p.status === "error") {
          stopPolling();
          downloadBtn.disabled = false;
          progressArea.classList.add("hidden");
          showError(p.error || "Download failed.");
        }
      }).catch(function () { /* keep polling through brief hiccups */ });
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    currentJob = null;
  }

  cancelBtn.addEventListener("click", function () {
    if (!currentJob) return;
    fetch("/api/cancel/" + currentJob, { method: "POST" }).catch(function () {});
  });

  function addHistory(info, quality) {
    var items = [];
    try { items = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]"); } catch (e) {}
    items.unshift({
      title: info.title, thumb: info.thumbnail,
      quality: quality.label, when: new Date().toLocaleString()
    });
    items = items.slice(0, 10);
    localStorage.setItem(LS_HISTORY, JSON.stringify(items));
    renderHistory();
  }

  function renderHistory() {
    var items = [];
    try { items = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]"); } catch (e) {}
    if (!items.length) {
      historyList.innerHTML = '<span class="empty">Nothing downloaded yet.</span>';
      return;
    }
    historyList.innerHTML = "";
    items.forEach(function (it) {
      var div = document.createElement("div");
      div.className = "history-item";
      var img = document.createElement("img");
      img.src = it.thumb || "";
      var text = document.createElement("div");
      var t = document.createElement("div");
      t.className = "h-title"; t.textContent = it.title || "";
      var m = document.createElement("div");
      m.className = "h-meta"; m.textContent = (it.quality || "") + " · " + (it.when || "");
      text.appendChild(t); text.appendChild(m);
      div.appendChild(img); div.appendChild(text);
      historyList.appendChild(div);
    });
  }

  renderHistory();
})();
</script>
</body>
</html>
